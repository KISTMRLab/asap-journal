[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asap-multioutputs-educational"
version = "0.1.0"
description = "Independent educational implementation of the ASAP multi-output screenplay pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
speech = ["kokoro>=0.9.4", "soundfile>=0.12", "faster-whisper>=1.1"]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
asap-multi = "asap_multi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

